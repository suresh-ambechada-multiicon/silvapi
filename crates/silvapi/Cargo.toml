[package]
name = "silvapi"
version.workspace = true
edition.workspace = true

[dependencies]
silvapi-core = { path = "../silvapi-core" }
gpui-kit = { workspace = true }
anyhow = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", default-features = false }
uuid = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
chrono = "0.4.45"
rand = "0.10.1"
rust-embed = "8.11.0"
instant = { version = "0.1.13", features = ["wasm-bindgen"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
tokio = { version = "1", features = ["rt"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }



