# Vendored copy of zed's gpui_web at rev 1d217ee39d381ac101b7cf49d3d22451ac1093fe, carrying one fix: upstream
# gates `shared_memory_supported` on the `multithreaded` feature but calls it
# unconditionally, so the single-threaded build does not compile. See
# src/dispatcher.rs.
#
# Single-threaded is what we need: the multithreaded path pulls `wasm_thread`,
# which requires a nightly compiler. Patched in rather than bumping the zed rev,
# because gpui-component is pinned to this exact revision.
[package]
name = "gpui_web"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
autoexamples = false

[features]
# Matches upstream. gpui_platform depends on this crate with default features, so
# emptying `default` here silently disabled threading and left the dispatcher
# reporting "SharedArrayBuffer not available".
default = ["multithreaded"]
multithreaded = ["dep:wasm_thread"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
parking_lot = { version = "0.12", features = ["nightly"] }
anyhow = "1"
futures = "0.3"
log = "0.4"
smallvec = "1"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
raw-window-handle = "0.6"
wasm_thread = { version = "0.3", features = ["es_modules"], optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "PointerEvent",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Storage",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }
