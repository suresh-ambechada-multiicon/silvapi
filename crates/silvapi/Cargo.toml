[package]
name = "silvapi"
version.workspace = true
edition.workspace = true

[dependencies]
silvapi-core = { path = "../silvapi-core" }
# No `rev` here on purpose: gpui-component declares its zed dependencies without
# one, and cargo treats a rev-pinned git source as *distinct* from an unpinned
# one — which pulls in two copies of gpui and makes its types mutually
# incompatible. The exact commit is pinned by Cargo.lock instead.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
anyhow = "1.0"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
chrono = "0.4.45"
rand = "0.10.1"
rust-embed = { version = "8.11.0", features = ["include-exclude"] }
log = "0.4"

# Native only. font-kit pulls freetype-sys, a C library with no wasm libc;
# rusqlite bundles SQLite the same way; tokio's multi-thread runtime needs real
# OS threads. On the web gpui_web supplies text shaping, storage is the browser's,
# and the single-threaded executor is the event loop.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }
reqwest = { version = "0.11", features = [
    "json",
    "rustls-tls",
    "stream",
], default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_family = "wasm")'.dependencies]
# gpui_web directly rather than via gpui_platform: gpui_platform enables
# gpui_web's default "multithreaded" feature, which pulls wasm_thread and needs
# a nightly compiler (feature(stdarch_wasm_atomic_wait)). Cargo unifies features,
# so the only way to keep it off is to not depend on gpui_platform here.
# Same gpui_platform as native. gpui-component's own web gallery builds this way:
# a plain wasm build with no atomics and no build-std. gpui_web still compiles its
# multithreaded dispatcher, and falls back to single-threaded at runtime when
# SharedArrayBuffer is unavailable.
gpui_platform = { git = "https://github.com/zed-industries/zed" }
# fetch-backed reqwest: no rustls, no streaming body, no native TLS.
reqwest = { version = "0.11", features = ["json"], default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "Element", "Location"] }
# Both majors are in the tree via different dependents, and each needs its
# wasm backend switched on explicitly or it refuses to build for this target.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
