[package]
name = "silvadl"
version.workspace = true
edition.workspace = true

[dependencies]
gpui-kit.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
yt-dlp = { version = "2.8.3", features = ["hooks", "rustls", "cache-json"] }
tokio = { version = "1", features = ["sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
tokio = { version = "1", features = ["rt"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "process", "fs"] }

