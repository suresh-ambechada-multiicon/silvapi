<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silvapi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: system-ui, -apple-system, sans-serif;
            color: #e4e7eb;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Centered loading screen */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0e14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loading-text">Loading Silvapi...</div>
    </div>

    <script type="module">
        import init from './silvapi.js';

        async function run() {
            // Initialize the WASM module (which automatically executes main)
            await init();
            
            // Fade out and remove the loading screen once loaded
            const loader = document.getElementById('loader');
            if (loader) {
                loader.classList.add('fade-out');
                setTimeout(() => loader.remove(), 500);
            }
        }

        run().catch((error) => {
            console.error(error);
            const textEl = document.querySelector('.loading-text');
            if (textEl) {
                textEl.textContent = 'Failed to load Silvapi. See console for details.';
                textEl.style.color = '#ef4444';
            }
            const spinner = document.querySelector('.spinner');
            if (spinner) {
                spinner.style.borderTopColor = '#ef4444';
                spinner.style.animationPlayState = 'paused';
            }
        });
    </script>
</body>
</html>
