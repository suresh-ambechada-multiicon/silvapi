[workspace]
members = ["crates/silvapi-core", "crates/silvapi", "crates/silvadl"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
gpui-kit = { version = "0.7.0", features = ["tree-sitter"] }
rust-embed = "8.11.0"

[profile.dev]
opt-level = 0
debug = "limited"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
